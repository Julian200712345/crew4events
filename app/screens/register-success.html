<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C4E · Gelukt</title><link rel="stylesheet" href="../styles.css"></head>
<body class="stage">
<div class="phone"><div class="notch"></div>
  <div class="screen" style="background:var(--black);">
    <div class="auth-hero" style="height:100%;">
      <div class="photo" style="background-image:url('https://crew4events.nl/assets/marketing/backstage_build.png');"></div>
      <div class="veil" style="background:linear-gradient(180deg, rgba(10,11,13,0.6), rgba(10,11,13,0.9));"></div>
      <div style="position:relative; height:100%; display:flex; flex-direction:column; padding:0 28px 36px; color:#fff;">
        <div class="statusbar" style="color:#fff;"><span>9:41</span><span class="icons"><svg class="cellbars" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.7a3.5 3.5 0 0 0-4.4 0L8 11.5z"/><path d="M3.2 6.1a7.6 7.6 0 0 1 9.6 0l-1.3 1.6a5.5 5.5 0 0 0-7 0L3.2 6.1z"/></svg><svg class="batt" viewBox="0 0 26 12"><rect x="0.7" y="0.7" width="21" height="10.6" rx="2.5" fill="none" stroke="#fff" stroke-width="1.3"/><rect x="2.3" y="2.3" width="15" height="7.4" rx="1.2"/><rect x="23" y="3.6" width="2" height="4.8" rx="1"/></svg></span></div>
        <div style="margin:auto 0; text-align:center;">
          <div style="width:96px; height:96px; border-radius:50%; background:var(--orange); display:grid; place-items:center; margin:0 auto 24px; box-shadow:0 10px 40px rgba(242,160,7,0.5);">
            <svg viewBox="0 0 24 24" stroke="#1A1305" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <div style="font-size:28px; font-weight:800; letter-spacing:-0.03em;">Welkom bij de crew! 🎉</div>
          <div style="color:rgba(255,255,255,0.7); font-size:15px; line-height:1.5; margin-top:12px; padding:0 8px;">Je account is aangemaakt. We checken je documenten — meestal binnen een paar uur. Je kunt nu al shifts bekijken.</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:11px;">
          <div style="display:flex; align-items:center; gap:11px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:13px 15px;">
            <span class="badge badge-green" style="background:rgba(21,160,90,0.2); color:#7BE0A8;"><svg viewBox="0 0 24 24" stroke="#7BE0A8" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg></span>
            <div style="font-size:13px; color:rgba(255,255,255,0.85);">Account &amp; e-mail geverifieerd</div>
          </div>
          <div style="display:flex; align-items:center; gap:11px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:13px 15px;">
            <div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--orange);border-top-color:transparent;flex-shrink:0;"></div>
            <div style="font-size:13px; color:rgba(255,255,255,0.85);">Documenten worden gecontroleerd</div>
          </div>
        </div>
        <a class="u" href="home.html" style="margin-top:20px;"><button class="btn btn-primary btn-block btn-lg">Naar de app</button></a>
      </div>
    </div>
  </div>
</div>
<script src="../qa-check.js"></script>
</body></html>
