<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C4E · Aanmelden</title><link rel="stylesheet" href="../styles.css"></head>
<body class="stage">
<div class="phone"><div class="notch"></div>
  <div class="screen">
    <div class="statusbar"><span>9:41</span><span class="icons"><svg class="cellbars" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.7a3.5 3.5 0 0 0-4.4 0L8 11.5z"/><path d="M3.2 6.1a7.6 7.6 0 0 1 9.6 0l-1.3 1.6a5.5 5.5 0 0 0-7 0L3.2 6.1z"/></svg><svg class="batt" viewBox="0 0 26 12"><rect x="0.7" y="0.7" width="21" height="10.6" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.3" y="2.3" width="15" height="7.4" rx="1.2"/><rect x="23" y="3.6" width="2" height="4.8" rx="1"/></svg></span></div>
    <div class="topbar with-back">
      <a class="u" href="intro-3.html"><button class="back-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button></a>
      <div class="topbar-title">Account aanmaken</div>
    </div>
    <div class="stepper" style="margin-top:4px;">
      <div class="st active"><i></i></div><div class="st"><i></i></div><div class="st"><i></i></div><div class="st"><i></i></div><div class="st"><i></i></div>
    </div>
    <div class="section" style="padding-top:16px;">
      <div class="eyebrow" style="margin-bottom:6px;">Stap 1 van 5</div>
      <div class="h1">Maak je account</div>
      <div class="subtle" style="margin-top:6px;">Begin met je e-mail en een wachtwoord.</div>
    </div>

    <div class="field" style="margin-top:18px;"><label>E-mailadres</label><input type="email" placeholder="jouw@email.nl" /></div>
    <div class="field"><label>Mobiel nummer</label>
      <div style="display:flex; gap:10px;">
        <div style="display:flex; align-items:center; gap:6px; padding:0 14px; border:1.5px solid var(--line-2); border-radius:var(--r-sm); font-weight:700; font-size:15px;">🇳🇱 +31</div>
        <input type="tel" placeholder="6 12345678" style="flex:1;" />
      </div>
    </div>
    <div class="field"><label>Wachtwoord</label>
      <div style="position:relative;">
        <input type="password" placeholder="Minimaal 8 tekens" style="padding-right:46px;" />
        <button class="icon-btn bare" style="position:absolute; right:8px; top:50%; transform:translateY(-50%);"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div style="display:flex; gap:5px; margin-top:10px;">
        <div style="flex:1; height:4px; border-radius:9px; background:var(--orange);"></div>
        <div style="flex:1; height:4px; border-radius:9px; background:var(--orange);"></div>
        <div style="flex:1; height:4px; border-radius:9px; background:var(--line-2);"></div>
      </div>
      <div style="font-size:12px; color:var(--ink-3); margin-top:7px;">Sterkte: <b style="color:var(--orange-ink);">goed</b></div>
    </div>

    <div style="display:flex; align-items:flex-start; gap:11px; padding:18px 20px 0;">
      <div class="switch on" style="margin-top:1px;"></div>
      <div class="legal" style="text-align:left; flex:1;">Ik ga akkoord met de <a href="#">Algemene Voorwaarden</a> en het <a href="#">Privacybeleid</a> van Crew4Events.</div>
    </div>

    <div class="field" style="margin-top:20px;">
      <a class="u" href="register-verify.html"><button class="btn btn-primary btn-block btn-lg">Doorgaan</button></a>
    </div>
    <div style="text-align:center; padding:18px 20px 28px; font-size:14px; color:var(--ink-2);">
      Al een account? <a class="help-link" href="login.html">Inloggen</a>
    </div>
  </div>
</div>
<script src="../qa-check.js"></script>
</body></html>
