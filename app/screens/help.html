<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C4E · Hulp</title><link rel="stylesheet" href="../styles.css"></head>
<body class="stage">
<div class="phone"><div class="notch"></div>
  <div class="screen bg-soft" style="padding-bottom:30px;">
    <div class="statusbar"><span>9:41</span><span class="icons"><svg class="cellbars" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.7a3.5 3.5 0 0 0-4.4 0L8 11.5z"/><path d="M3.2 6.1a7.6 7.6 0 0 1 9.6 0l-1.3 1.6a5.5 5.5 0 0 0-7 0L3.2 6.1z"/></svg><svg class="batt" viewBox="0 0 26 12"><rect x="0.7" y="0.7" width="21" height="10.6" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.3" y="2.3" width="15" height="7.4" rx="1.2"/><rect x="23" y="3.6" width="2" height="4.8" rx="1"/></svg></span></div>
    <div class="topbar with-back" style="background:var(--surface-2);">
      <a class="u" href="profile.html" style="width:auto;"><button class="back-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button></a>
      <div class="topbar-title">Hulp &amp; contact</div>
    </div>

    <div class="section" style="padding-bottom:8px;"><div class="h2">Waarmee kunnen we helpen?</div></div>
    <div class="field" style="margin-top:6px;">
      <div style="position:relative;">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke="var(--ink-3)" fill="none" style="width:18px;height:18px;position:absolute;left:14px;top:50%;transform:translateY(-50%);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input style="padding-left:42px;" placeholder="Zoek in veelgestelde vragen" />
      </div>
    </div>

    <!-- Quick contact -->
    <div style="display:flex; gap:12px; padding:16px 20px 0;">
      <div class="tile" style="text-align:center;"><div style="width:40px;height:40px;border-radius:11px;background:var(--green-bg);display:grid;place-items:center;margin:0 auto 8px;"><svg viewBox="0 0 24 24" stroke="var(--green-text)" fill="none" stroke-width="2" style="width:20px;height:20px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><div style="font-weight:700; font-size:14px;">WhatsApp</div><div class="subtle" style="font-size:12px;">Reactie ~15 min</div></div>
      <div class="tile" style="text-align:center;"><div style="width:40px;height:40px;border-radius:11px;background:var(--blue-bg);display:grid;place-items:center;margin:0 auto 8px;"><svg viewBox="0 0 24 24" stroke="var(--blue-text)" fill="none" stroke-width="2" style="width:20px;height:20px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div><div style="font-weight:700; font-size:14px;">Bellen</div><div class="subtle" style="font-size:12px;">Ma–vr 9–18u</div></div>
    </div>

    <div class="group-label">Veelgestelde vragen</div>
    <div class="group">
      <div class="list-row"><div class="li-main"><div class="li-t">Wanneer krijg ik uitbetaald?</div></div><span class="chev">›</span></div>
      <div class="list-row"><div class="li-main"><div class="li-t">Hoe werkt in- en uitchecken?</div></div><span class="chev">›</span></div>
      <div class="list-row"><div class="li-main"><div class="li-t">Wat als ik een shift moet annuleren?</div></div><span class="chev">›</span></div>
      <div class="list-row"><div class="li-main"><div class="li-t">Welke verzekering heb ik nodig?</div></div><span class="chev">›</span></div>
      <div class="list-row"><div class="li-main"><div class="li-t">Mijn AVB uploaden of vernieuwen</div></div><span class="chev">›</span></div>
    </div>
  </div>
</div>
<script src="../qa-check.js"></script>
</body></html>
