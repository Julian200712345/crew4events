<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C4E · Over jou</title><link rel="stylesheet" href="../styles.css"></head>
<body class="stage">
<div class="phone"><div class="notch"></div>
  <div class="screen" style="padding-bottom:100px;">
    <div class="statusbar"><span>9:41</span><span class="icons"><svg class="cellbars" viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg class="wifi" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.7a3.5 3.5 0 0 0-4.4 0L8 11.5z"/><path d="M3.2 6.1a7.6 7.6 0 0 1 9.6 0l-1.3 1.6a5.5 5.5 0 0 0-7 0L3.2 6.1z"/></svg><svg class="batt" viewBox="0 0 26 12"><rect x="0.7" y="0.7" width="21" height="10.6" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.3" y="2.3" width="15" height="7.4" rx="1.2"/><rect x="23" y="3.6" width="2" height="4.8" rx="1"/></svg></span></div>
    <div class="topbar with-back">
      <a class="u" href="register-verify.html" style="width:auto;"><button class="back-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button></a>
      <div class="topbar-title">Over jou</div>
    </div>
    <div class="stepper" style="margin-top:4px;">
      <div class="st done"><i></i></div><div class="st done"><i></i></div><div class="st active"><i></i></div><div class="st"><i></i></div><div class="st"><i></i></div>
    </div>
    <div class="section" style="padding-top:16px;">
      <div class="eyebrow" style="margin-bottom:6px;">Stap 3 van 5</div>
      <div class="h1">Maak je profiel compleet</div>
    </div>

    <!-- Profile photo -->
    <div style="display:flex; justify-content:center; padding:20px 0 4px;">
      <div style="position:relative;">
        <div style="width:96px; height:96px; border-radius:50%; background:var(--surface-3); border:1px solid var(--line-2); display:grid; place-items:center; overflow:hidden;">
          <svg viewBox="0 0 24 24" stroke="var(--ink-3)" fill="none" stroke-width="1.8" style="width:42px;height:42px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div style="position:absolute; right:-2px; bottom:-2px; width:32px; height:32px; border-radius:50%; background:var(--orange); border:3px solid var(--surface); display:grid; place-items:center;">
          <svg viewBox="0 0 24 24" stroke="#1A1305" fill="none" stroke-width="2.4" style="width:15px;height:15px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>
    </div>
    <div class="center subtle" style="font-size:12.5px; margin-bottom:4px;">Voeg een profielfoto toe — vergroot je kans op shifts</div>

    <div style="display:flex; gap:12px;">
      <div class="field" style="flex:1;"><label>Voornaam</label><input value="Tom" /></div>
      <div class="field" style="flex:1;"><label>Achternaam</label><input value="de Vries" /></div>
    </div>
    <div class="field"><label>Geboortedatum</label>
      <div style="position:relative;">
        <input value="14-03-2002" style="padding-right:44px;" />
        <svg viewBox="0 0 24 24" stroke="var(--ink-3)" fill="none" stroke-width="2" style="width:18px;height:18px;position:absolute;right:15px;top:50%;transform:translateY(-50%);"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:8px;"><svg viewBox="0 0 24 24" stroke="var(--green-text)" fill="none" stroke-width="2.4" style="width:14px;height:14px;"><path d="M20 6L9 17l-5-5"/></svg><span style="font-size:12px; color:var(--green-text); font-weight:600;">23 jaar · voldoet aan 18+ eis</span></div>
    </div>
    <div class="field"><label>Woonplaats</label>
      <div style="position:relative;">
        <input value="Eindhoven" style="padding-right:44px;" />
        <svg viewBox="0 0 24 24" stroke="var(--ink-3)" fill="none" stroke-width="2" style="width:18px;height:18px;position:absolute;right:15px;top:50%;transform:translateY(-50%);"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
    </div>
  </div>
  <div class="sticky-cta">
    <a class="u" href="register-work.html"><button class="btn btn-primary btn-block btn-lg">Doorgaan</button></a>
  </div>
</div>
<script src="../qa-check.js"></script>
</body></html>
